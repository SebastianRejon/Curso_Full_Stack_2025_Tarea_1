<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1 | Paso 1</title>
    <link rel="stylesheet" href="css/normalizer.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <input type="checkbox" id="touch">
    <label class="buttom" for="touch"></label>
        <div class="container">
            <div class="hero">
                <h1>Información Personal</h1>
            </div>
            <form class="form" action="#">
                <input class="form_input" type="text" placeholder="Nombre" required minlength="3" maxlength="45"
                    pattern="[a-zA-Z\s]*">
                <input class="form_input" type="text" placeholder="Apellido" required minlength="3" maxlength="45"
                    pattern="[a-zA-Z\s]*">
                <input class="form_input" type="email" placeholder="Correo" required
                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                <input class="form_input" type="date" placeholder="Fecha Nacimiento" required min="1900-01-01">
                <select class="form_input_country">
                    <option value="AR">Argentina</option>
                    <option value="BO">Bolivia</option>
                    <option value="BR">Brasil</option>
                    <option value="CL">Chile</option>
                    <option value="CO">Colombia</option>
                    <option value="CR">Costa Rica</option>
                    <option value="CU">Cuba</option>
                    <option value="DO">República Dominicana</option>
                    <option value="EC">Ecuador</option>
                    <option value="SV">El Salvador</option>
                    <option value="GQ">Guinea Ecuatorial</option>
                    <option value="GT">Guatemala</option>
                    <option value="HN">Honduras</option>
                    <option value="MX">México</option>
                    <option value="NI">Nicaragua</option>
                    <option value="PA">Panamá</option>
                    <option value="PY">Paraguay</option>
                    <option value="PE">Perú</option>
                    <option value="PR">Puerto Rico</option>
                    <option value="ES">España</option>
                    <option value="UY">Uruguay</option>
                    <option value="VE">Venezuela</option>
                </select>
                <input class="form_buttom" type="submit" value="Enviar">        
            </form>
        </div>
</body>

</html>
